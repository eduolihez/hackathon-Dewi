version: 2

updates:
  # --- GitHub Actions (.github/workflows/) --------------------------------
  # Anadido: dependabot-auto-merge.yml usa dependabot/fetch-metadata, y esa
  # action tambien envejece. Sin este bloque, el propio mecanismo que mantiene
  # al dia las dependencias se quedaba atras sin avisar.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    groups:
      dependencias-menores:
        update-types:
          - "minor"
          - "patch"

  # Sub-proyecto anidado con su propio package.json
  - package-ecosystem: "npm"
    directory: "/Prototip/prototip-web"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(prototip-web)"
    open-pull-requests-limit: 5
    groups:
      dependencias-menores:
        update-types:
          - "minor"
          - "patch"
